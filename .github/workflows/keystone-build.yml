name: Keystone build
run-name: "[KEYSTONE_BUILD] ${{ github.sha }}"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every pull request records itself in CHANGELOG.md
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::This pull request does not touch CHANGELOG.md. Add one line under '# Changelog' saying what it changes, then push again."
            exit 1
          fi
          echo "CHANGELOG.md has an entry."
