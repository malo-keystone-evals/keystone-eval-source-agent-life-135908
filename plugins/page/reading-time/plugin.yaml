kind: page
framework: react
name: reading-time
# Mounted twice on the book record page (config/pages/book_page.yaml) — as a tab
# and as a block in the overview tab — so it binds to a single `books` record
# delivered as PageProps.subject either way. Nothing here says which mounts are
# allowed; the page YAML alone decides (ADR-0090). React is supplied by the
# framework adapter — no explicit npm dependencies needed.
input:
  subject_model: books
