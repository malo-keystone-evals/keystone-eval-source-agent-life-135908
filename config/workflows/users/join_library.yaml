# The workflow behind the `member` Onboarding Process's one step: it creates
# the `members` row that the process's `membership` binding is looking for, so
# running it once is what satisfies the precondition and lets the user in.
#
# **The trigger is anchored on the acting user's own `users` row**, and that is
# the point of ADR-0110 D4 rather than an accident. A manual run is dispatched
# against a model and a record id, and the record this run is *about* — the
# membership — does not exist yet, which is the whole reason the step is being
# shown. So the step names no `record:` and the anchor falls back to the user's
# own row, which every signed-in caller has by definition. Who may dispatch it
# is therefore a `kind: workflow` permission on the `profile` policy in
# specs/users.yaml, granted through the zero-hop `self` local role: your own
# row, and nobody else's.
#
# `run_as: system` rather than `user`, and this is the other half of the same
# decision. The caller holds no `create` on `members` — `member` is granted on
# the rows reachable *through* a membership, and they have none — so a run with
# their authority would be refused by the policy that exists to stop patrons
# enrolling each other. The platform is what enrols somebody who has been let
# through the door; the gate on the act is the dispatch permission above.
version: 3
run_as: system

trigger:
  kind: manual
  model_name: users
  # An account that cannot sign in is not one being onboarded: `invited` is a
  # pending invitation, and the Focus Layout is only ever shown to a session.
  status:
    - active
  # What the modal's form hands over. As on `invite_user`, this is not checked
  # against the modal — a workflow modal's form is typed `any` client-side, so
  # the two are kept in step by hand — but the `required` on the object is what
  # makes an untouched form a refused dispatch rather than a run with nothing
  # in it.
  user_input_schema:
    kind: object
    required: true
    properties:
      display_name:
        kind: string
        required: true
        description: How the member is shown around the library.
      membership_tier:
        kind: string
        enum:
          - bronze
          - silver
          - gold
        description: The tier the member starts on; blank takes the default.

description: >-
  Enrol the acting user as a library member: upsert the `members` row the
  `member` Onboarding Process waits for, so running the step twice updates the
  membership rather than failing on the one-membership-per-user index.

nodes:
  # An upsert, matched on `user_id` — which `members` covers with a unique
  # index, as an upsert's match must be. A first run creates the row in
  # `active`; a second (the step re-shown, a double submit) finds it and
  # updates its name and tier, leaving its status alone. Two submits racing
  # settle in the database: the loser becomes an update.
  - id: enrol
    title: Enrol, or update the membership
    action:
      kind: upsert_model
      model_name: members
      match:
        - user_id

connections:
  # `.id` is the anchor record's id, which here is the acting user's own — that
  # is what makes `user_id` correct without the form carrying it, and what
  # stops a caller enrolling anybody else even if they hand-crafted the
  # payload: the dispatch gate already refused every row but their own.
  #
  # Both form fields are read with `get`, for the reason `invite_user` spells
  # out: a workflow modal's form submits only what somebody touched, and a
  # plain access on an untouched field drops the whole Item with a warning
  # nobody reads. An untouched tier takes the column's own `bronze` default.
  - from_id: entry
    to_id: enrol
    filters: []
    transform:
      steps:
        # The status the row starts in when the upsert creates it; an update
        # never moves a status.
        - kind: copy
          from: active
          to: ".status"
        - kind: copy
          from: .id
          to: ".properties.user_id"
        - kind: copy
          from: .user_input.get("display_name")
          to: ".properties.display_name"
        - kind: copy
          from: .user_input.get("membership_tier", "bronze")
          to: ".properties.membership_tier"
