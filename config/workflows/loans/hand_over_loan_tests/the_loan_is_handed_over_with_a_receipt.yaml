# The main flow: the book and the member are found, the loan goes active,
# and the receipt goes out. No handler runs.
version: 3
name: the_loan_is_handed_over_with_a_receipt
description: A requested loan goes active and the member is emailed a receipt.
now: 2026-06-01T00:00:00Z
backdrop:
  records:
    users:
      - $alias: u1
        fields:
          email: alice@example.com
          first_name: Alice
          last_name: Reader
    members:
      - $alias: m1
        fields:
          user_id: u1
          display_name: Alice R.
    authors:
      - $alias: a1
        fields:
          name: Frank Herbert
    books:
      - $alias: b1
        fields:
          title: Dune
          author_id: a1
          status: published
    loans:
      - $alias: l1
        fields:
          book_id: b1
          member_id: m1
          due_on: "2026-06-15"
          status: requested
trigger:
  kind: manual
  record: l1
expect:
  world:
    transitioned:
      loans:
        - record: l1
          from: requested
          to: active
  calls:
    send_receipt:
      - body:
          email: alice@example.com
          book: Dune
