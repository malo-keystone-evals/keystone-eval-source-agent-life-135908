# A custom endpoint (ADR-0049) that demonstrates ADR-0059 *response egress*:
# `GET /api/endpoints/book_secret/{book_id}` returns the book's `webhook_secret`.
#
# `webhook_secret` is Encrypted Storage (`sensitivity: password`), so it lives
# encrypted at rest — in the column, and in this run's persisted trace/envelope.
# Returning it to the browser is off-platform egress, gated exactly like an
# api_call: the value may reach the response only because (1) the `returns[200]`
# body declares `webhook_secret` as `sensitivity: password` (the typed sink) and
# (2) the respond node sets `returns_sensitive_data: true`. At runtime the engine
# keeps the persisted `{code, body}` envelope encrypted and decrypts the secret
# for the wire only — so the page renders plaintext while nothing is stored as
# plaintext.
#
# The `book-secret` page-plugin tab (plugins/page/book-secret) calls this with
# `keystone.callEndpoint({ name: "book_secret", method: "get", recordId })`.
version: 3
run_as: system
trigger:
  kind: endpoint
  method: get
  path: book_secret
  # Anchored to a book: the `/{id}` URL segment names the record, whose
  # properties (including the decrypted `webhook_secret`) are the entry Item.
  model_name: books
  # Only a caller who can view the book may reveal its secret.
  auth:
    policies:
      - admin
  returns:
    - code: 200
      body:
        kind: object
        properties:
          title:
            kind: string
          # Declaring this Password is the typed sink: without it, routing the
          # secret here would be a `workflow/sensitive-write` validation error.
          webhook_secret:
            kind: string
            sensitivity: password
  timeout_seconds: 15

nodes:
  - id: respond_ok
    title: Return the book's title and its decrypted webhook secret
    action:
      kind: respond
      status: 200
      # The egress opt-in. Drop this and the project fails to build with
      # `workflow/sensitive-egress` — secret egress is off by default.
      returns_sensitive_data: true

connections:
  # The entry Item is the anchor book (id, status, and every property flat), so
  # copy the two fields the response contract declares straight into the body.
  - from_id: entry
    to_id: respond_ok
    filters: []
    transform:
      steps:
        - kind: copy
          from: ".title"
          to: ".title"
        - kind: copy
          from: ".webhook_secret"
          to: ".webhook_secret"
