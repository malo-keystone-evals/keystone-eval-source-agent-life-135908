version: 3
run_as: system
trigger:
  kind: on_enter
  model_name: books
  statuses:
    - published
nodes:
  - id: enrich
    title: Derive a token from the secret (plugin, decrypts_sensitive_data)
    action:
      kind: plugin
      plugin_name: enrich
  - id: stamp
    title: Carry the token + derive a non-secret fingerprint (plugin)
    action:
      kind: plugin
      plugin_name: stamp
  - id: post_secret
    title: POST the token to the echo service
    action:
      kind: api_call
      method: post
      path: /post
      input_schema:
        kind: object
        required: true
        properties:
          body:
            kind: object
            properties:
              token:
                kind: string
                sensitivity: password
              fingerprint:
                kind: string
      request_mode: per_item
      external_api: echo
      input_transform:
        steps:
          - kind: copy
            from: ".body"
            to: ".body"
      output_schema:
        kind: any
      output_transform:
        steps:
          - kind: copy
            from: "."
            to: ".response"
      response_format:
        kind: json
      output_mode: single
      sends_sensitive_data: true
connections:
  - from_id: entry
    to_id: enrich
    filters: []
    transform:
      steps:
        - kind: copy
          from: ".webhook_secret"
          to: ".webhook_secret"
  - from_id: enrich
    to_id: stamp
    filters: []
  - from_id: stamp
    to_id: post_secret
    filters: []
    transform:
      steps:
        - kind: copy
          from: ".token"
          to: ".body.token"
        - kind: copy
          from: ".fingerprint"
          to: ".body.fingerprint"
