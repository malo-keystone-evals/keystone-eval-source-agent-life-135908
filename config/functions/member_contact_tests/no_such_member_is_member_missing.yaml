# The fetch finds nothing, so its Empty Edge reaches the Fail node and the
# call answers with the declared error.
version: 3
name: no_such_member_is_member_missing
description: An id that names no member answers member_missing.
backdrop:
  records:
    users:
      - $alias: u1
        fields:
          email: alice@example.com
          first_name: Alice
          last_name: Reader
    members:
      - $alias: m1
        fields:
          user_id: u1
          display_name: Alice R.
trigger:
  kind: call
  input:
    member_id: 00000000-0000-4000-8000-000000000001
expect:
  error: member_missing
