# [[Model Profile]]s — the project's named ways of calling a model.
#
# Generated by `keystone-dev upgrade` from the inline `model:` blocks that used
# to live on each agentic_loop node, then renamed by hand, which is what the
# generated header asks for.
#
# Named after the model, not after what a workflow uses them for. A tier is a
# workflow's opinion: `curate_book` thinks `mini-thinking` is what careful work
# deserves, and `catalogue_desk` thinks `mini-fast` is plenty for the same
# library — so neither word belongs in a name both of them read. Each workflow
# says what it means in the expression that picks a profile.

- name: mini-fast
  provider: open-ai
  model: gpt-5.4-mini
  context_window: 400000
  reasoning_effort: low

- name: mini-thinking
  provider: open-ai
  model: gpt-5.4-mini
  context_window: 400000
  reasoning_effort: medium

# The one profile that can see (ADR-0114). `vision` is the author's claim about
# the model — nothing infers it from the id — and it is what makes a node's
# `view:` valid and gives the agent the built-in `view_file` tool. The others
# leave it at its default, `false`, because nothing that uses them needs to
# look at a file.
- name: mini-vision
  provider: open-ai
  model: gpt-5.4-mini
  context_window: 400000
  reasoning_effort: low
  vision: true

# The cheapest way to call a model this library has: a handful of words, like a
# conversation's title (ADR-0115), with no thinking to pay for.
- name: nano
  provider: open-ai
  model: gpt-5.4-nano
  context_window: 400000
  reasoning_effort: low
