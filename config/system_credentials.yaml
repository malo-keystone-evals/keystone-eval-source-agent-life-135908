# System Credentials (ADR-0041) — named bindings of a `credentials` row to an
# External API. The declaration says "we hold a credential called X for API Y";
# the secret itself is entered at runtime on the admin credentials page, never
# committed. api_call nodes reference these by name: `credential: {kind: system,
# name: isbndb_main}`, which validation checks statically against this list.
- name: isbndb_main
  external_api: isbndb
- name: notifications_main
  external_api: notifications
# Binds the file store's access keys to the framework-shipped `file_storage`
# External API (ADR-0064). Referenced by `file_storage.credential` in
# config.yaml. Declaring it satisfies config validation; local dev uses the Dev
# File Store, so no secret needs entering on the admin credentials page for a
# dev run.
- name: file_storage_main
  external_api: file_storage
# The Anthropic API key every agentic_loop node in this project authenticates
# with (`model.credential: anthropic_api`). Set the key on the admin
# credentials page before triggering an agentic workflow live.
- name: anthropic_api
  external_api: anthropic
# Same pattern for OpenAI — point an agentic node at it with
# `model: { provider: open-ai, credential: open_ai_api, … }`.
- name: open_ai_api
  external_api: open_ai
# Where an [[Agent Sandbox]] runs (ADR-0072). Unlike a model credential, which a
# node names and which therefore resolves per node, this one is
# deployment-level: the engine finds it by its *binding* to the `e2b` External
# API rather than by name, so a project may call it whatever it likes and a
# second binding is an error rather than a silent tie-break.
#
# The reading desk's `sandbox` tool needs it. With no key set it fails closed at
# the moment a command would run — the run reports a misconfiguration instead of
# quietly answering without having looked anything up.
- name: e2b_main
  external_api: e2b
# The SMTP account every System Email leaves through (ADR-0079), bound to the
# framework-shipped `system_email` External API and named by `email.credential`
# in config.yaml. `http_basic` because SMTP AUTH is a username and a password;
# the connection itself is this credential's `base_url`. Set both on the admin
# credentials page before sending live — dev runs capture into the Dev Mail
# Store and never reach a mail server.
- name: system_email_main
  external_api: system_email
# The Turnstile secret a signup's CAPTCHA token is checked against (ADR-0082),
# bound to the framework-shipped `turnstile` External API and named by
# `captcha.credential` in config.yaml. `api_key` because the secret is one
# opaque string; it rides the verify request's body, not a header, which is why
# this API declares no `api_key_in`. Unlike every other credential here the
# secret is checked *synchronously in the signup handler* — the request has to
# block on the answer — and the composed URL is still checked against the domain
# whitelist. Dev runs never reach Cloudflare: Dev Mode waves the token through.
- name: turnstile_main
  external_api: turnstile
